<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://steep-haze-2da0.cloudflare-vbmev.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16120f">
<meta name="robots" content="noindex">
<title>Modifica domande · Quiz sull'HIV</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img id="logo" src="logo.png" data-logo-dark="logo.png" data-logo-light="logo-rosso.png" alt="Croce Rossa Italiana - Comitato di Francavilla Fontana - Oria">
  <div class="topbtns">
    <button id="btnA11y" class="topbtn" type="button" aria-pressed="false" aria-label="Alto contrasto e testo più spazioso" title="Alto contrasto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="7" r="1.6" fill="currentColor" stroke="none"></circle>
        <path d="M6.3 10.1c1.7.9 3.7 1.4 5.7 1.4s4-.5 5.7-1.4"></path>
        <path d="M12 11.5v3.2l-2.6 4.6M12 14.7l2.6 4.6"></path>
      </svg>
    </button>
    <button id="btnLight" class="topbtn" type="button" aria-pressed="false" aria-label="Modalità chiara" title="Modalità chiara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2.3M12 19.2v2.3M21.5 12h-2.3M4.8 12H2.5M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"></path>
      </svg>
    </button>
  </div>
</header>
<main>
<h1>Modifica <em>domande</em></h1>

<section id="login" hidden>
  <p class="lead">Area riservata a chi può modificare le domande del quiz.</p>
  <label class="field" for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="enter">Accedi</button>
  <div id="loginMsg" aria-live="polite" class="mt18"></div>
</section>

<section id="editor" hidden>
  <p class="lead">Le modifiche restano una bozza finché non premi <strong>Pubblica</strong>. I codici già emessi non cambiano.</p>

  <div class="passbox">
    <label class="field" for="title">Titolo del quiz</label>
    <input id="title" type="text" maxlength="60" autocomplete="off">
  </div>

  <div class="passbox">
    <label class="field" for="pass">Risposte giuste necessarie per ottenere il codice</label>
    <input id="pass" type="number" min="1" step="1">
    <span id="passInfo"></span>
  </div>

  <div id="list"></div>
  <button id="addq" class="ghost">Aggiungi domanda</button>

  <div id="saveMsg" aria-live="polite" class="mt22"></div>
  <div class="savebar">
    <button id="save" disabled>Pubblica</button>
    <button id="revert" class="ghost">Annulla modifiche</button>
    <button id="logout" class="ghost">Esci</button>
    <span id="state" class="state"></span>
  </div>
</section>
</main>
<script src="domande.js"></script>
</body></html>
