<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://steep-haze-2da0.cloudflare-vbmev.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16120f">
<title>Quiz · CRI Francavilla Fontana - Oria</title>
<link rel="stylesheet" href="style.css">
<script src="qrcode.js"></script>
</head>
<body>
<header class="top"><img src="logo.png" alt="Croce Rossa Italiana - Comitato di Francavilla Fontana - Oria"></header>
<main>

<section id="start">
  <h1 id="title"></h1>
  <p class="lead" id="lead">Rispondi alle domande, una alla volta, e ricevi un codice personale valido una sola volta.</p>
  <button id="go" disabled>Inizia il quiz</button>
  <p id="loadMsg" class="hint" aria-live="polite">Caricamento delle domande…</p>
</section>

<section id="quiz" hidden>
  <div class="meta"><span id="count"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <fieldset class="plain">
    <legend class="qtext" id="qtext"></legend>
    <div class="opts" id="opts"></div>
  </fieldset>
  <div class="actions">
    <button id="back" class="ghost" hidden>Indietro</button>
    <button id="next" disabled>Avanti</button>
  </div>
  <div id="err" aria-live="polite"></div>
</section>

<section id="result" hidden aria-live="polite"></section>

</main>
<script src="index.js"></script>
</body></html>
