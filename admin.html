<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16120f">
<meta name="robots" content="noindex">
<title>Pannello admin · Quiz sull'HIV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><img src="logo.png" alt="Croce Rossa Italiana - Comitato di Francavilla Fontana - Oria"></header>
<main>
<h1>Pannello <em>admin</em></h1>

<section id="login">
  <p class="lead">Inserisci la password per verificare i codici.</p>
  <label class="field" for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="enter">Accedi</button>
  <div id="loginMsg" aria-live="polite" style="margin-top:18px"></div>
</section>

<section id="panel" hidden>
  <p class="lead">Inserisci il codice e premi il pulsante: se è valido viene segnato come usato.</p>
  <label class="field" for="code">Codice da verificare</label>
  <input id="code" type="text" autocomplete="off" placeholder="XXXX-XXXX">
  <button id="check">Verifica codice</button>
  <div id="res" aria-live="polite" style="margin-top:18px"></div>
</section>
</main>
<script>
const API = "https://steep-haze-2da0.cloudflare-vbmev.workers.dev";
const $ = (id) => document.getElementById(id);
let password = "";
const call = (path, body) => fetch(API + path, {
  method: body ? "POST" : "GET",
  headers: { "Authorization": "Bearer " + password, "Content-Type": "application/json" },
  body: body ? JSON.stringify(body) : undefined });
const show = (el, cls, text) => { el.innerHTML = '<p class="msg ' + cls + '"></p>'; el.firstChild.textContent = text; };

// Testo da mostrare quando il server rifiuta l'accesso (password errata o blocco temporaneo)
async function denied(r) {
  const d = await r.json().catch(() => ({}));
  const min = Math.max(1, Math.ceil((d.retryAfter || 0) / 60));
  if (r.status === 429) return "Troppi tentativi errati: accesso bloccato. Riprova tra circa " + min + " minuti.";
  if (d.left === 0) return "Password errata. Accesso bloccato per circa " + min + " minuti.";
  return "Password errata. Tentativi rimasti: " + d.left + ".";
}

$("enter").onclick = async () => {
  password = $("pw").value;
  try {
    const r = await call("/api/admin/check");
    if (!r.ok) return show($("loginMsg"), "ko", await denied(r));
    $("login").hidden = true; $("panel").hidden = false;
    $("code").value = decodeURIComponent(location.hash.slice(1)); // precompilato dal QR
  } catch { show($("loginMsg"), "ko", "Server non raggiungibile."); }
};
$("pw").onkeydown = (e) => { if (e.key === "Enter") $("enter").click(); };
$("code").onkeydown = (e) => { if (e.key === "Enter") $("check").click(); };

$("check").onclick = async () => {
  try {
    const r = await call("/api/admin/verify", { code: $("code").value });
    if (r.status === 401 || r.status === 429) return show($("res"), "ko", await denied(r));
    const d = await r.json();
    if (d.status === "valid") show($("res"), "ok", "Codice valido (" + d.code + "). Ora è segnato come usato.");
    else if (d.status === "used") show($("res"), "ko", "Codice già usato il " + new Date(d.used).toLocaleString("it-IT") + ".");
    else show($("res"), "ko", "Codice non valido.");
  } catch { show($("res"), "ko", "Server non raggiungibile."); }
};
</script>
</body></html>
