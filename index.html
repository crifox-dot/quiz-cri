<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://steep-haze-2da0.cloudflare-vbmev.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16120f">
<title>Quiz · CRI Francavilla Fontana - Oria</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<script src="qrcode.js"></script>
</head>
<body>
<header class="top">
  <img id="logo" src="logo.png" data-logo-dark="logo.png" data-logo-light="logo-rosso.png" alt="Croce Rossa Italiana - Comitato di Francavilla Fontana - Oria">
  <div class="topbtns">
    <button id="btnA11y" class="topbtn" type="button" aria-pressed="false" aria-label="Alto contrasto e testo più spazioso" title="Alto contrasto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="7" r="1.6" fill="currentColor" stroke="none"></circle>
        <path d="M6.3 10.1c1.7.9 3.7 1.4 5.7 1.4s4-.5 5.7-1.4"></path>
        <path d="M12 11.5v3.2l-2.6 4.6M12 14.7l2.6 4.6"></path>
      </svg>
    </button>
    <button id="btnLight" class="topbtn" type="button" aria-pressed="false" aria-label="Modalità chiara" title="Modalità chiara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2.3M12 19.2v2.3M21.5 12h-2.3M4.8 12H2.5M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"></path>
      </svg>
    </button>
  </div>
</header>
<main>

<section id="start">
  <h1 id="title"></h1>
  <p class="lead" id="lead">Rispondi alle domande, una alla volta, e ricevi un codice personale valido una sola volta.</p>
  <button id="go" disabled>Inizia il quiz</button>
  <p id="loadMsg" class="hint" aria-live="polite">Caricamento delle domande…</p>
  <p id="huntNote" class="hint" aria-live="polite" hidden></p>
</section>

<section id="quiz" hidden>
  <div class="meta"><span id="count"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <p id="quizNote" class="hint" aria-live="polite" hidden></p>
  <fieldset class="plain">
    <legend class="qtext" id="qtext"></legend>
    <div class="opts" id="opts"></div>
  </fieldset>
  <div class="actions">
    <button id="back" class="ghost" hidden>Indietro</button>
    <button id="next" disabled>Avanti</button>
  </div>
  <div id="err" aria-live="polite"></div>
</section>

<section id="result" hidden aria-live="polite"></section>

</main>
<script src="index.js"></script>
</body></html>
